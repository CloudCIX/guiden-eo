<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CloudCIX Guiden®</title>
    <link rel="stylesheet" href="styles/main.css?v=1.4.7" />
    <script src="../v1/plugins.js"></script>
    <script defer src="scripts/code.js?v=1.4.7"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">CloudCIX</div>
          <h1>Guiden®</h1>
          <p>Productivity assistant for Euro-Office</p>
        </div>
        <div class="model">Mistral-Medium-3.5</div>
      </header>

      <div class="status" id="status" role="status">Ready. Guiden® will detect the active editor and selection automatically.</div>

      <section class="group result-group" id="resultGroup" hidden>
        <div class="section-title">Suggestion</div>
        <div class="preview" id="preview"></div>
        <div class="result-actions">
          <button id="apply" type="button">Apply</button>
          <button id="copy" type="button">Copy</button>
          <button id="discard" type="button">Discard</button>
        </div>
      </section>

      <section class="group">
        <div class="section-title">Action</div>
        <div class="quick-actions" id="quickActions">
          <button type="button" data-prompt="Improve the selected writing. Keep the meaning, make it clearer, smoother, and more polished.">Improve</button>
          <button type="button" data-prompt="Rewrite this in a professional business tone. Keep it concise and clear.">Professional</button>
          <button type="button" data-prompt="Fix spelling, grammar, punctuation, and awkward phrasing. Do not change the meaning.">Fix</button>
          <button type="button" data-prompt="Make this shorter while preserving the important points.">Shorten</button>
          <button type="button" data-prompt="Expand this with useful detail while keeping the tone natural.">Expand</button>
          <button type="button" data-prompt="Summarize this into the key points.">Summarize</button>
          <button type="button" data-prompt="Rewrite this as clear bullet points.">Bullets</button>
          <button type="button" data-prompt="Rewrite this as a polished email.">Email</button>
        </div>

        <label class="field">
          <span>Custom instruction</span>
          <textarea id="prompt" rows="5" autocomplete="off" placeholder="Ask Guiden® to rewrite, summarize, draft, clean up, analyze, or generate content for the current editor."></textarea>
        </label>

        <div class="controls-grid">
          <label class="field compact">
            <span>Document style</span>
            <select id="format">
              <option value="auto">Auto</option>
              <option value="email">Email</option>
              <option value="report">Report</option>
              <option value="briefing">Briefing note</option>
              <option value="bullets">Bullet list</option>
              <option value="minutes">Minutes</option>
            </select>
          </label>

          <label class="field compact">
            <span>Tone</span>
            <select id="tone">
              <option value="Keep the tone appropriate to the original text.">Auto</option>
              <option value="Use a clear professional tone.">Professional</option>
              <option value="Use a concise executive tone.">Executive</option>
              <option value="Use a warm friendly tone.">Friendly</option>
              <option value="Use a plain English tone.">Plain English</option>
            </select>
          </label>

          <label class="field compact span-2">
            <span>Length</span>
            <select id="length">
              <option value="Use the most appropriate length for the instruction.">Auto</option>
              <option value="Make the result shorter than the source.">Shorter</option>
              <option value="Keep the result about the same length as the source.">Same</option>
              <option value="Make the result more detailed than the source.">Longer</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button id="generate" type="button">Generate</button>
          <button id="stop" type="button" disabled>Stop</button>
          <button id="clear" type="button">Clear</button>
        </div>
      </section>

      <section class="group settings">
        <details>
          <summary>Settings</summary>
          <label class="field">
            <span>CloudCIX API key</span>
            <input id="apiKey" type="password" autocomplete="off" />
          </label>

          <label class="remember">
            <input id="rememberKey" type="checkbox" />
            Remember key on this browser
          </label>

          <button id="saveSettings" type="button">Save settings</button>
        </details>
      </section>
    </main>
  </body>
</html>
