# Builds the Euro-Office image with Guiden built in, and publishes it to ghcr.io/cloudcix/guiden-eo.
# Pull requests are built and tested but not published. Pushes to main publish `main` and `sha-<commit>`;
# a tag such as v2.0.17 also publishes `2.0.17`. Deployments should pin the digest the job prints.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: make validate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the plugin
        run: node plugin/cloudcix-guiden/tests/run.js

      - name: Tag names
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cloudcix/guiden-eo
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Digest to deploy
        if: github.event_name != 'pull_request'
        run: echo "ghcr.io/cloudcix/guiden-eo@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
