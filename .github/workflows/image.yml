# Builds the Euro-Office image with Guiden built in, and publishes it to ghcr.io/cloudcix/guiden-eo.
#
# Releasing is automatic: a merge into main whose plugin version (plugin/cloudcix-guiden/config.json) has no tag yet
# publishes the image as `<version>`, tags the commit `v<version>` and makes a GitHub release from CHANGELOG.md.
# euro-office-deploy's Renovate then opens a merge request for the new version. Every push to main also publishes
# `main` and `sha-<commit>`. Pull requests are built and tested but not published, and a pull request that changes
# what goes into the image must raise the version.
#
# Third-party actions are pinned to a commit, with the version beside it; Dependabot keeps them up to date.
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to publish the image
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release == 'true' || github.ref_type == 'tag' }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate
        run: make validate

      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          version="$(make -s version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = pull_request ]; then
            # A change to what goes into the image needs a new version, or it would never be released.
            git fetch -q origin "$BASE_REF"
            if ! git diff --quiet "origin/$BASE_REF...HEAD" -- plugin runtime Dockerfile; then
              before="$(git show "origin/$BASE_REF:plugin/cloudcix-guiden/config.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
              if [ "$(printf '%s\n%s\n' "$before" "$version" | sort -V | tail -1)" = "$before" ]; then
                echo "::error file=plugin/cloudcix-guiden/config.json::This changes the image, so raise the version above $before (and add a CHANGELOG.md section)"
                exit 1
              fi
            fi
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            make check-tag TAG="$GITHUB_REF_NAME"
          elif ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the test tools
        run: npm ci && npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Test the plugin
        run: npm test

      - name: Test the panel in a browser
        run: npm run test:browser

      - name: Tag names
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/cloudcix/guiden-eo
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: guiden-eo:test

      - name: Test Guiden in the real editor
        run: |
          # Port 80 on both sides: the editor fetches the example's files from the address the browser uses, and
          # inside the container that address must reach the same server. The example's files are on a local address.
          docker run -d --name guiden-eo-test -p 80:80 -e JWT_ENABLED=false -e EXAMPLE_ENABLED=true \
            -e ALLOW_PRIVATE_IP_ADDRESS=true guiden-eo:test
          EDITOR_URL=http://localhost node tests/editor.js

      - name: Keep the editor test's screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-test-results
          path: editor-test-results/
          if-no-files-found: ignore

      - name: Editor logs
        if: failure()
        run: docker logs guiden-eo-test 2>&1 | tail -200 || true

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Digest to deploy
        if: github.event_name != 'pull_request'
        run: echo "ghcr.io/cloudcix/guiden-eo@${{ steps.build.outputs.digest }} (version ${{ steps.version.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: image
    if: needs.image.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag and release a new version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          # This section of CHANGELOG.md, then the image to deploy.
          awk -v v="$VERSION" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\n**Image:** `ghcr.io/cloudcix/guiden-eo:%s@%s`\n' "$VERSION" "$DIGEST" >> notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file notes.md
          else
            # Creating the tag through the release, with this job's token, doesn't start another run.
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Guiden $VERSION" --notes-file notes.md
          fi
